name: Update Repository Statistics

on:
  workflow_dispatch:

  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  update-repository-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get repository counts
        id: repos
        env:
          GH_TOKEN: ${{ secrets.REPO_COUNT_TOKEN }}
          GH_USERNAME: ebacalso77
        run: |
          public_count=0
          private_count=0

          page=1

          while true; do
            response=$(curl -s \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/user/repos?visibility=all&affiliation=owner&per_page=100&page=$page")

            count=$(echo "$response" | jq 'length')

            if [ "$count" -eq 0 ]; then
              break
            fi

            public_page=$(echo "$response" | jq '[.[] | select(.private == false)] | length')
            private_page=$(echo "$response" | jq '[.[] | select(.private == true)] | length')

            public_count=$((public_count + public_page))
            private_count=$((private_count + private_page))

            page=$((page + 1))
          done

          total_count=$((public_count + private_count))

          echo "Public repositories: $public_count"
          echo "Private repositories: $private_count"
          echo "Total repositories: $total_count"

          echo "public=$public_count" >> "$GITHUB_OUTPUT"
          echo "private=$private_count" >> "$GITHUB_OUTPUT"
          echo "total=$total_count" >> "$GITHUB_OUTPUT"

      - name: Update README
        env:
          PUBLIC_COUNT: ${{ steps.repos.outputs.public }}
          PRIVATE_COUNT: ${{ steps.repos.outputs.private }}
          TOTAL_COUNT: ${{ steps.repos.outputs.total }}
        run: |
          python <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("README.md")
          content = path.read_text()

          public_count = os.environ["PUBLIC_COUNT"]
          private_count = os.environ["PRIVATE_COUNT"]
          total_count = os.environ["TOTAL_COUNT"]

          replacement = f"""<!-- REPOSITORY_STATS_START -->
          <p align="center">
            <img src="https://img.shields.io/badge/Public%20Repositories-{public_count}-181717?style=for-the-badge&logo=github" alt="Public repositories" />
            <img src="https://img.shields.io/badge/Private%20Repositories-{private_count}-6C5CE7?style=for-the-badge&logo=github" alt="Private repositories" />
            <img src="https://img.shields.io/badge/Total%20Repositories-{total_count}-2F80ED?style=for-the-badge&logo=github" alt="Total repositories" />
          </p>

          > My public GitHub profile contains selected repositories. Additional private repositories include professional, client, and project work that cannot be publicly shared.
          <!-- REPOSITORY_STATS_END -->"""

          pattern = r"<!-- REPOSITORY_STATS_START -->.*?<!-- REPOSITORY_STATS_END -->"

          updated_content = re.sub(
              pattern,
              replacement,
              content,
              flags=re.DOTALL
          )

          path.write_text(updated_content)
          PY

      - name: Commit updated README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "docs: update repository statistics"
            git push
          fi
